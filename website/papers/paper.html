        function getPaperId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'ddpm_2020';
        }

        function renderPaper(paperId) {
            const paper = PAPERS[paperId];
            if (!paper) {
                document.getElementById('paper-content').innerHTML = '<h2>Paper not found</h2>';
                return;
            }

            const statusClass = 'status-' + paper.status;
            const statusText = {
                'completed': '✅ Completed',
                'reading': '🔄 Reading',
                'unread': '⬜️ Unread',
                'review': '🔁 Review'
            }[paper.status];

            const concepts = paper.concepts.map(c => `<span class="concept-tag">${c}</span>`).join('');

            const links = [];
            if (paper.arxiv) {
                links.push(`<a href="${paper.arxiv}" target="_blank">📄 ArXiv</a>`);
            }
            if (paper.code) {
                links.push(`<a href="${paper.code}" target="_blank">💻 Code</a>`);
            }
            if (paper.notes) {
                links.push(`<a href="../${paper.notes}">📝 Notes</a>`);
            }
            links.push(`<a href="../scripts/update_status.py">🔄 Update Status</a>`);

            const contributions = paper.contributions.map(c => `<li>${c}</li>`).join('');

            const rating = paper.rating ? '⭐'.repeat(paper.rating) : 'Not rated';

            document.title = `${paper.title} - Diffusion Models`;
            document.getElementById('paper-content').innerHTML = `
                <div class="back-link">
                    <a href="../index.html">← Back to Chart</a>
                </div>

                <div class="paper-header">
                    <h1>${paper.title}</h1>
                    <div class="authors">
                        ${paper.authors.join(', ')}
                    </div>
                    <div class="meta">
                        <span><strong>Venue:</strong> ${paper.venue}</span>
                        <span><strong>Year:</strong> ${paper.year}</span>
                        <span><strong>Priority:</strong> ${paper.priority}</span>
                        <span><strong>Difficulty:</strong> ${paper.level}</span>
                    </div>
                    <div style="margin-top: 15px;">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <span style="margin-left: 15px;"><strong>Rating:</strong> ${rating}</span>
                    </div>
                </div>

                <div class="paper-links">
                    ${links.join('')}
                </div>

                <div class="paper-section">
                    <h2>📖 Why Read This Paper?</h2>
                    <p style="line-height: 1.8;">${paper.whyRead}</p>
                </div>

                <div class="paper-section">
                    <h2>📝 Summary</h2>
                    <p style="line-height: 1.8;">${paper.summary}</p>
                </div>

                    </div>
                </div>

                    <h2>💡 Key Contributions</h2>
                    <ul style="line-height: 2;">
                        ${contributions}
                    </ul>
                </div>

                    <h2>📚 Reading Notes</h2>
                    <p>This paper has been read and annotated. Check out the detailed notes:</p>
                    <p><a href="../${paper.notes}" style="color: #f59e0b; font-weight: bold;">→ View Reading Notes</a></p>

                        <li><strong>Add notes:</strong> <code>python ../scripts/update_status.py --id ${paperId} --notes_file "Notes/my_notes.md"</code></li>
                        <li><strong>Search similar:</strong> <code>python ../scripts/search_papers.py --query "${paper.keywords || paper.title.split(' ').slice(0, 3).join(' ')}"</code></li>

            `;
