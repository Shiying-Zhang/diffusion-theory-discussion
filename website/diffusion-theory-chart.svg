  </text>

  <!-- Foundational Layer -->
  <rect x="50" y="120" width="1300" height="180" fill="#f0f8ff" stroke="#000080" stroke-width="2" rx="10"/>
  <text x="700" y="150" font-family="Georgia, serif" font-size="18" text-anchor="middle" font-weight="bold">
