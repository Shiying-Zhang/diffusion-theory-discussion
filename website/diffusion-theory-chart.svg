  </text>

  <!-- Arrows showing relationships -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <!-- Score Matching to NCSN -->
  <line x1="225" y1="280" x2="200" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Score Matching to DDPM -->
  <line x1="300" y1="280" x2="400" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SDE to Score SDE -->
  <line x1="850" y1="280" x2="950" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Thermodynamics to DDPM -->
  <line x1="1100" y1="280" x2="500" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- DDPM to EDM -->
