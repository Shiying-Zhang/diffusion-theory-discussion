  <!-- NCSN to EDM -->
  <line x1="250" y1="560" x2="600" y2="670" stroke="#228B22" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Score SDE to EDM -->
  <line x1="950" y1="560" x2="750" y2="670" stroke="#228B22" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- EDM to Fast Sampling -->
