  <rect x="1100" y="850" width="200" height="90" fill="#ffffff" stroke="#000" stroke-width="2" rx="5"/>
  <text x="1200" y="875" font-family="Georgia, serif" font-size="12" text-anchor="middle" font-weight="bold">
