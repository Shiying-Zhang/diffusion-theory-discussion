  </text>

  <!-- Score Matching -->
  <rect x="100" y="170" width="250" height="110" fill="#ffffff" stroke="#000" stroke-width="2" rx="5"/>
  <text x="225" y="195" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-weight="bold">
    Score Matching
  </text>
  <text x="225" y="215" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#444">
