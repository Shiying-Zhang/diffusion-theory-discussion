<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <!-- Title -->
  <text x="700" y="40" font-family="Georgia, serif" font-size="24" text-anchor="middle" font-weight="bold">
    Diffusion Models: Theoretical Foundations Chart
  </text>

  <text x="700" y="70" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#666">
