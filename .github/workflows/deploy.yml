name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Assemble site
        run: |
          mkdir -p ./_site

          # Copy all website files
          cp -r website/* ./_site/

          # Copy data directory (papers.json for JS fetch)
          cp -r data ./_site/data

          # Copy notes (for markdown links)
          cp -r notes ./_site/notes

          # Copy root README
          cp README.md ./_site/

          # index.html = Simple Chart, interactive.html = Interactive Chart
          # 两个页面各自保留，不覆盖

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
